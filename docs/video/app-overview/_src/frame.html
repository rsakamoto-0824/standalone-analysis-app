<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>動画フレーム</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#091b2b;color:#f4f8fc;font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans",Arial,sans-serif;-webkit-font-smoothing:antialiased}.canvas{position:relative;width:1920px;height:1080px;background:radial-gradient(ellipse at 82% 12%,#173d56 0,transparent 49%),linear-gradient(130deg,#102d45,#081727)}.brand{position:absolute;left:88px;top:54px;font-size:20px;font-weight:700;letter-spacing:3px;color:#82d9e8}.release{position:absolute;right:76px;top:48px;padding:12px 22px;border:1px solid #547186;border-radius:30px;font-size:19px;color:#c9d9e5}.eyebrow{position:absolute;left:88px;top:146px;font-size:23px;color:#7cdaeb;font-weight:600}.title{position:absolute;left:88px;top:203px;width:480px;margin:0;font-size:54px;font-weight:700;line-height:1.34;letter-spacing:-1.5px;white-space:pre-line}.bullets{position:absolute;left:88px;top:430px;width:463px;display:grid;gap:27px}.bullet{position:relative;padding-left:26px;font-size:25px;line-height:1.7;color:#dbe8f1}.bullet:before{content:"";position:absolute;left:0;top:17px;width:7px;height:7px;border-radius:50%;background:#6ce0cf}.note{position:absolute;left:88px;top:760px;width:463px;border-left:3px solid #e6b862;padding:12px 0 12px 19px;font-size:20px;line-height:1.7;color:#e6c997}.screen-title{position:absolute;left:600px;top:151px;font-size:19px;color:#b5cedf}.screen{position:absolute;left:600px;top:194px;width:1248px;height:690px;overflow:hidden;border:1px solid #547084;background:#eaf0f5;box-shadow:0 25px 60px #0005}.screen:after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px #ffffff22;pointer-events:none}.screen img{position:absolute;max-width:none}.chapter{position:absolute;left:88px;top:1036px;font-size:18px;color:#95b2c8}.page{position:absolute;right:76px;top:1036px;font-size:18px;color:#95b2c8}.caption{width:1744px;height:100px;display:flex;align-items:center;justify-content:center;text-align:center;background:#051321f5;border-top:1px solid #345770;border-bottom:1px solid #345770;color:#fff;padding:12px 32px;font-size:31px;line-height:1.55;font-weight:500}.steps,.checks{padding:64px;background:linear-gradient(150deg,#173f58,#0c263b);height:100%;display:grid;gap:25px}.step{display:flex;align-items:center;gap:28px;padding:18px 34px;border:1px solid #47778d;border-radius:16px;background:#102d44}.num{font-size:34px;color:#79e1d5;font-weight:700;min-width:64px}.step strong{font-size:37px;font-weight:600}.step small{display:block;margin-top:8px;font-size:23px;color:#aac8db}.checks{align-content:center;gap:28px}.check{border-left:5px solid #5fdbbc;background:#13374d;padding:26px 30px;font-size:32px;line-height:1.55}.check.pending{border-color:#f0c274;color:#f4d6a7}.check small{display:block;color:#abc7d8;font-size:22px;margin-top:8px}.intro .title{font-size:70px}.intro .bullets{top:465px}.intro .note{top:755px}
</style></head><body><main class="canvas" id="canvas"><div class="brand">MATLAB ANALYSIS APP</div><div class="release">R2025b 向けソース ｜ 最終検証は未実施</div><div class="eyebrow" id="label"></div><h1 class="title" id="title"></h1><div class="bullets" id="bullets"></div><div class="note" id="note"></div><div class="screen-title" id="screen-title">参考画面 ｜ 合成データ・表示見本</div><div class="screen" id="screen"></div><div class="chapter" id="chapter"></div><div class="page" id="page"></div></main><script>
const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
window.show=async(scene,index,total,mode,caption='')=>{
  document.body.innerHTML='<main class="canvas" id="canvas"><div class="brand">MATLAB ANALYSIS APP</div><div class="release">R2025b 向けソース ｜ 最終検証は未実施</div><div class="eyebrow" id="label"></div><h1 class="title" id="title"></h1><div class="bullets" id="bullets"></div><div class="note" id="note"></div><div class="screen-title" id="screen-title">参考画面 ｜ 合成データ・表示見本</div><div class="screen" id="screen"></div><div class="chapter" id="chapter"></div><div class="page" id="page"></div></main>';
  if(mode==='caption'){document.body.style.background='transparent';document.body.innerHTML='<div class="caption">'+esc(caption)+'</div>';await document.fonts.ready;return;}
  const get=id=>document.getElementById(id);get('label').textContent=scene.label;get('title').textContent=scene.title;get('note').textContent=scene.note;get('chapter').textContent=scene.chapter;get('page').textContent=String(index+1).padStart(2,'0')+' / '+total;
  get('bullets').innerHTML=scene.bullets.map(x=>'<div class="bullet">'+esc(x)+'</div>').join('');if(scene.id==='intro')get('canvas').classList.add('intro');
  const panel=get('screen');
  if(scene.layout==='steps'){
    panel.innerHTML='<div class="steps">'+[['入力する','Excel / CSV を開く'],['確認する','列の役割と順番を指定'],['比較する','学習・検証・グラフを確認'],['保存する','結果表・モデル・図を書き出す']].map((x,i)=>'<div class="step"><div class="num">0'+(i+1)+'</div><div><strong>'+x[0]+'</strong><small>'+x[1]+'</small></div></div>').join('')+'</div>';
    get('screen-title').textContent='基本操作の4ステップ';
  }else if(scene.layout==='status'){
    panel.innerHTML='<div class="checks"><div class="check">数値補助テスト：86件成功<small>R2022bでの補助確認。実GPRの学習は未実施。</small></div><div class="check">画面・操作の補助確認済み<small>合成データと表示専用コピーを使用。</small></div><div class="check pending">R2025b / Windows：最終検証待ち<small>実GPR・モデル互換性・exe・Runtimeを確認予定。</small></div></div>';
    get('screen-title').textContent='確認済みの範囲と、残っている作業';
  }else{
    const image=new Image();image.src='/docs/user-guide/images/'+scene.image;await image.decode();panel.append(image);
    const crop=scene.crop||[0,0,1,1];const w=image.naturalWidth,h=image.naturalHeight;const scale=Math.min(1248/(crop[2]*w),690/(crop[3]*h));
    image.style.width=w*scale+'px';image.style.height=h*scale+'px';image.style.left=((1248-crop[2]*w*scale)/2-crop[0]*w*scale)+'px';image.style.top=((690-crop[3]*h*scale)/2-crop[1]*h*scale)+'px';
  }
  await document.fonts.ready;
  if(mode==='base')panel.style.visibility='hidden';
  if(mode==='panel'){document.body.style.background='#0c263b';panel.style.position='fixed';panel.style.left='0';panel.style.top='0';panel.style.border='0';panel.style.boxShadow='none';document.body.append(panel);get('canvas').remove();}
};
</script></body></html>
